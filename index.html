<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flamme Rouge — Deck Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#1E2023;
    --asphalt-2:#26292D;
    --chalk:#F3EFE6;
    --chalk-dim:#B9B5AC;
    --yellow:#F2C230;
    --exhaust:#B23A2E;
    --exhaust-2:#D14A3C;
    --team-red:#A9332B;
    --team-red-2:#C24B3D;
    --team-blue:#2C5C8A;
    --team-blue-2:#4C7FB0;
    --team-black:#2B2D31;
    --team-black-2:#54575D;
    --team-green:#3F7A52;
    --team-green-2:#5FA377;
    --line:rgba(243,239,230,0.14);
    --good:#5FA777;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(180deg, transparent 0 40px, var(--line) 40px 42px),
      var(--asphalt);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    padding:28px 20px 80px;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header{margin-bottom:24px;}
  .eyebrow{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--yellow);
    margin:0 0 4px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4vw,42px);
    margin:0 0 6px;
    letter-spacing:0.01em;
  }
  .sub{color:var(--chalk-dim);font-size:14px;max-width:640px;line-height:1.5;margin:0;}

  .banner{
    margin-bottom:24px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--asphalt-2);
    padding:18px;
    display:flex;
    justify-content:center;
  }
  .banner img{
    display:block;
    width:180px;
    height:180px;
    border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }

  .panel{
    background:var(--asphalt-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:22px;
  }
  .panel h2{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin:0 0 14px;
    color:var(--chalk-dim);
  }
  .setup-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--chalk-dim);}
  input[type=text], select{
    background:var(--asphalt);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:9px 10px;
    border-radius:6px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    min-width:150px;
  }
  input[type=text]:focus, select:focus{outline:2px solid var(--yellow);outline-offset:1px;}
  .btn{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-size:13px;
    border:none;
    border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
    transition:transform .08s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;}
  .btn-primary{background:var(--yellow);color:var(--asphalt);}
  .btn-ghost{background:transparent;color:var(--chalk);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--chalk-dim);}
  .btn-ghost:disabled{opacity:0.45;cursor:default;color:var(--chalk-dim);}
  .btn-ghost:disabled:hover{border-color:var(--line);}
  .btn-danger{background:transparent;color:var(--sprinteur-2);border:1px solid var(--sprinteur);}
  .btn-small{padding:6px 10px;font-size:11px;}

  .top-actions{display:flex;justify-content:flex-end;gap:10px;margin-bottom:18px;}

  .riders{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
  .rider{
    background:var(--asphalt-2);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    position:relative;
  }
  .rider-head{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
  }
  .rider.color-red .rider-head{background:linear-gradient(90deg,var(--team-red),var(--team-red-2));}
  .rider.color-blue .rider-head{background:linear-gradient(90deg,var(--team-blue),var(--team-blue-2));}
  .rider.color-black .rider-head{background:linear-gradient(90deg,var(--team-black),var(--team-black-2));}
  .rider.color-green .rider-head{background:linear-gradient(90deg,var(--team-green),var(--team-green-2));}
  .bib{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:26px;
    background:rgba(0,0,0,0.25);
    border-radius:8px;
    padding:4px 10px;
    min-width:44px;
    text-align:center;
  }
  .rider-name{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;}
  .rider-type{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.85;}
  .rider-type .suit-icon{margin-right:4px;letter-spacing:-1px;}
  .rider-remove{margin-left:auto;background:none;border:none;color:rgba(255,255,255,0.75);cursor:pointer;font-size:18px;line-height:1;padding:4px;}
  .rider-remove:hover{color:#fff;}

  .rider-body{padding:16px;}
  .stats{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;align-items:center;min-width:56px;}
  .stat-num{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;}
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--chalk-dim);}
  .stack{position:relative;width:32px;height:26px;margin:0 auto 4px;}
  .stack-card{
    position:absolute;left:6px;right:6px;height:20px;
    border:1px solid rgba(243,239,230,0.3);
    border-radius:3px;background:var(--asphalt);
  }
  .rider.color-red .stack-card{border-color:var(--team-red-2);}
  .rider.color-blue .stack-card{border-color:var(--team-blue-2);}
  .rider.color-black .stack-card{border-color:var(--team-black-2);}
  .rider.color-green .stack-card{border-color:var(--team-green-2);}

  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--chalk-dim);margin:0 0 8px;}
  .hand{display:flex;gap:8px;margin-bottom:14px;min-height:64px;flex-wrap:wrap;}
  .card-btn{
    width:56px;height:64px;
    background:var(--chalk);
    color:var(--asphalt);
    border:none;border-radius:7px;
    font-family:'Oswald',sans-serif;
    font-size:24px;font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 0 rgba(0,0,0,0.35);
    transition:transform .08s ease;
    position:relative;
  }
  .card-btn.suit-star::after{
    content:'\2605';
    position:absolute;bottom:5px;right:7px;
    font-size:11px;color:rgba(30,32,35,0.4);
  }
  .card-btn.suit-circle::after{
    content:'\25CF\25CF';
    position:absolute;bottom:5px;right:6px;
    font-size:8px;letter-spacing:-1px;color:rgba(30,32,35,0.4);
  }
  .card-btn:hover{transform:translateY(-3px);}
  .card-btn:active{transform:translateY(0);}
  .card-btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}
  .card-back{
    background:repeating-linear-gradient(45deg, var(--asphalt), var(--asphalt) 6px, var(--asphalt-2) 6px, var(--asphalt-2) 12px);
    color:var(--chalk-dim);
    border:1px solid var(--line);
    cursor:default;
    box-shadow:none;
  }
  .card-back:hover{transform:none;}
  .card-exhaust{
    background:var(--exhaust-2);
    color:var(--chalk);
    box-shadow:0 2px 0 rgba(0,0,0,0.35), inset 0 0 0 2px rgba(0,0,0,0.2);
  }
  .card-played{
    cursor:default;
    border:2px solid var(--yellow);
    box-shadow:0 0 0 3px rgba(242,194,48,0.18);
  }
  .card-played:hover{transform:none;}
  .ex-text{color:var(--exhaust-2);}
  .legend-note{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;color:var(--chalk-dim);
    align-self:center;margin-left:2px;
  }
  .legend-swatch{
    width:11px;height:11px;border-radius:3px;
    background:var(--exhaust-2);display:inline-block;
  }
  .empty-hint{color:var(--chalk-dim);font-size:13px;align-self:center;}

  .rider-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}

  .history{font-size:12px;color:var(--chalk-dim);line-height:1.6;}
  .history b{color:var(--chalk);}
  .reshuffle-flag{
    display:inline-block;margin-left:8px;font-size:10px;
    color:var(--good);text-transform:uppercase;letter-spacing:0.05em;
  }

  .empty-state{
    text-align:center;padding:40px 20px;color:var(--chalk-dim);
    border:1px dashed var(--line);border-radius:12px;
  }
  .empty-state b{color:var(--chalk);}

  .custom-fields{display:none;gap:10px;flex-wrap:wrap;}
  .custom-fields.show{display:flex;}

  @media (prefers-reduced-motion: reduce){
    .btn, .card-btn{transition:none;}
  }
</style>
</head>

  <div class="panel">
    <h2>Add a rider</h2>
    <div class="setup-row">
      <div class="field">
        <label for="color-select">Colour</label>
        <select id="color-select">
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="black">Black</option>
          <option value="green">Green</option>
        </select>
      </div>
      <div class="field">
        <label for="type-select">Deck</label>

      </div>
      <button class="btn btn-primary" id="add-rider-btn">Add rider</button>
    </div>
  </div>

    sprinteur: { cards:[2,2,2,3,3,3,4,4,4,5,5,5,9,9,9], exhaustion:2, label:'Sprinter' }
  };

  var riders = [];
  var nextId = 1;

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function makeRider(name, type, cards, exhaustion, color){
    return {
      id: nextId++,
      bib: riders.length + 1,
      name: name,
      type: type,
      color: color,
      exhaustionValue: exhaustion,
      deck: shuffle(cards.map(function(v){ return {v:v, ex:false}; })),
      discard: [],
      hand: [],
      playedCard: null,
      turnPhase: 'hand',
      history: [],
      totalDistance: 0,
      reshuffles: 0,
      justReshuffled: false,
      revealed: false,
      exhaustionAddedThisTurn: false,
      undoSnapshot: null
    };
  }

  function revealRider(id){
    riders.forEach(function(r){ r.revealed = (r.id === id) ? !r.revealed : false; });
    render();
  }

  function dealHand(rider){
    rider.justReshuffled = false;
    var drawn = [];
    while(drawn.length < 4){
      if(rider.deck.length === 0){
        if(rider.discard.length === 0) break;
        rider.deck = shuffle(rider.discard);
        rider.discard = [];
        rider.reshuffles++;
        rider.justReshuffled = true;
      }
      var idx = Math.floor(Math.random()*rider.deck.length);
      drawn.push(rider.deck.splice(idx,1)[0]);
    }
    rider.hand = drawn;
  }

  function playCard(rider, handIdx){
    rider.undoSnapshot = {
      hand: rider.hand.slice(),
      discard: rider.discard.slice(),
      turnPhase: rider.turnPhase,
      playedCard: rider.playedCard,
      revealed: rider.revealed,
      exhaustionAddedThisTurn: rider.exhaustionAddedThisTurn
    };
    var played = rider.hand.splice(handIdx,1)[0];
    rider.playedCard = played;
    rider.discard = rider.discard.concat(rider.hand);
    rider.hand = [];
    rider.turnPhase = 'played';
    render();
  }

  function undoPlay(rider){
    if(!rider.undoSnapshot) return;
    var snap = rider.undoSnapshot;
    rider.hand = snap.hand;
    rider.discard = snap.discard;
    rider.turnPhase = snap.turnPhase;
    rider.playedCard = snap.playedCard;
    rider.revealed = snap.revealed;
    rider.exhaustionAddedThisTurn = snap.exhaustionAddedThisTurn;
    rider.undoSnapshot = null;
    render();
  }

  function nextTurn(rider){
    if(rider.playedCard){
      rider.history.unshift(rider.playedCard);
      if(rider.history.length > 8) rider.history.length = 8;
      rider.totalDistance += rider.playedCard.v;
      rider.playedCard = null;
    }
    rider.turnPhase = 'hand';
    rider.revealed = false;
    rider.exhaustionAddedThisTurn = false;
    rider.undoSnapshot = null;
    dealHand(rider);
    render();
  }

  function addExhaustion(rider){
    if(rider.exhaustionAddedThisTurn) return;
    rider.discard.push({v: rider.exhaustionValue, ex:true});
    rider.exhaustionAddedThisTurn = true;
    render();
  }

  function removeRider(id){
    riders = riders.filter(function(r){ return r.id !== id; });
    riders.forEach(function(r,i){ r.bib = i+1; });
    render();
  }

  function resetRace(){
    riders.forEach(function(r){
      var base = r.type === 'custom' ? r._customCards : DECKS[r.type].cards;
      r.deck = shuffle(base.map(function(v){ return {v:v, ex:false}; }));
      r.discard = [];
      r.hand = [];
      r.playedCard = null;
      r.turnPhase = 'hand';
      r.history = [];
      r.totalDistance = 0;
      r.reshuffles = 0;
      r.revealed = false;
      r.exhaustionAddedThisTurn = false;
      r.undoSnapshot = null;
      dealHand(r);
    });
    render();
  }

  function clearAll(){
    riders = [];
    render();
  }

  function stackVisual(count){
    var layers = Math.max(1, Math.min(4, Math.ceil(count/4)));
    if(count === 0) return '<div class="stack"></div>';
    var html = '<div class="stack">';
    for(var i=0;i<layers;i++){
      html += '<div class="stack-card" style="bottom:'+(i*3)+'px;"></div>';
    }
    html += '</div>';
    return html;
  }

  function riderCard(r){
    var suitClass = r.type === 'rouleur' ? 'suit-star' : (r.type === 'sprinteur' ? 'suit-circle' : 'suit-none');
    var suitIcon = r.type === 'rouleur' ? '\u2605' : (r.type === 'sprinteur' ? '\u25CF\u25CF' : '');
    var handHtml = '';
    var sectionLabel = '';
    if(r.turnPhase === 'played' && r.playedCard){
      var pc = r.playedCard;
      sectionLabel = 'Played this round — add exhaustion, then advance';
      handHtml = '<div class="card-btn card-played '+suitClass+(pc.ex ? ' card-exhaust' : '')+'" aria-label="Played '+pc.v+(pc.ex ? ' (exhaustion)' : '')+'">'+pc.v+'</div>';
    } else if(r.hand.length === 0){
      sectionLabel = 'Hand';
      handHtml = '<div class="empty-hint">No cards left anywhere — add an exhaustion card or reset the race.</div>';
    } else if(!r.revealed){
      sectionLabel = 'Hand — hidden from the table';
      r.hand.forEach(function(){
        handHtml += '<div class="card-btn card-back" aria-hidden="true">?</div>';
      });
    } else {
      sectionLabel = 'Hand — tap the card played';
      r.hand.forEach(function(card, i){
        var cls = 'card-btn ' + suitClass + (card.ex ? ' card-exhaust' : '');
        handHtml += '<button class="'+cls+'" data-action="play" data-id="'+r.id+'" data-idx="'+i+'" aria-label="Play '+card.v+(card.ex ? ' (exhaustion)' : '')+'">'+card.v+'</button>';
      });
    }
    var revealLabel = (r.turnPhase === 'hand' && r.hand.length > 0) ? (r.revealed ? 'Hide hand' : 'Show hand') : '';

    var historyHtml = r.history.length
      ? 'Recent: ' + r.history.map(function(c){ return c.ex ? '<b class="ex-text">'+c.v+'</b>' : '<b>'+c.v+'</b>'; }).join(', ')
      : 'Recent: —';

    return (
      '<div class="rider type-'+r.type+' color-'+r.color+'">' +
        '<div class="rider-head">' +
          '<div class="bib">'+r.bib+'</div>' +
          '<div>' +
            '<div class="rider-name">'+escapeHtml(r.name)+'</div>' +
            '<div class="rider-type">'+(suitIcon ? '<span class="suit-icon">'+suitIcon+'</span>' : '')+(r.type==='custom' ? 'Custom deck' : DECKS[r.type].label)+'</div>' +
          '</div>' +
          '<button class="rider-remove" data-action="remove" data-id="'+r.id+'" aria-label="Remove rider" title="Remove rider">&times;</button>' +
        '</div>' +
        '<div class="rider-body">' +
          '<div class="stats">' +
            '<div class="stat">'+stackVisual(r.deck.length)+'<span class="stat-num">'+r.deck.length+'</span><span class="stat-label">Deck</span></div>' +
            '<div class="stat">'+stackVisual(r.discard.length)+'<span class="stat-num">'+r.discard.length+'</span><span class="stat-label">Discard</span></div>' +
            '<div class="stat"><span class="stat-num">'+r.totalDistance+'</span><span class="stat-label">Distance</span></div>' +
            '<div class="stat"><span class="stat-num">'+r.reshuffles+'</span><span class="stat-label">Reshuffles</span></div>' +
          '</div>' +
          '<p class="section-label">'+sectionLabel+(r.justReshuffled ? '<span class="reshuffle-flag">Just reshuffled</span>' : '')+'</p>' +
          '<div class="hand">'+handHtml+'</div>' +
          '<div class="rider-actions">' +
            (revealLabel ? '<button class="btn btn-primary btn-small" data-action="reveal" data-id="'+r.id+'">'+revealLabel+'</button>' : '') +
            (r.exhaustionAddedThisTurn
              ? '<button class="btn btn-ghost btn-small" disabled>Exhaustion added ✓</button>'
              : '<button class="btn btn-ghost btn-small" data-action="exhaust" data-id="'+r.id+'">Add exhaustion ('+r.exhaustionValue+')</button>') +
            (r.turnPhase === 'played' ? '<button class="btn btn-ghost btn-small" data-action="undo" data-id="'+r.id+'">Undo</button>' : '') +
            (r.turnPhase === 'played' ? '<button class="btn btn-primary btn-small" data-action="next" data-id="'+r.id+'">Next turn</button>' : '') +
            '<span class="legend-note"><span class="legend-swatch"></span>exhaustion card</span>' +
          '</div>' +
          '<div class="history">'+historyHtml+'</div>' +
        '</div>' +
      '</div>'
    );
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(){
    var mount = document.getElementById('riders-mount');
    var topActions = document.getElementById('top-actions');
    if(riders.length === 0){
      topActions.style.display = 'none';
      mount.innerHTML = '<div class="empty-state"><b>No riders yet.</b><br>Add your first rider above — the deck deals itself and keeps dealing until the pack is gone.</div>';
      return;
    }
    topActions.style.display = 'flex';
    mount.innerHTML = '<div class="riders">' + riders.map(riderCard).join('') + '</div>';
  }

  document.getElementById('type-select').addEventListener('change', function(e){
    document.getElementById('custom-fields').classList.toggle('show', e.target.value === 'custom');
  });

  document.getElementById('add-rider-btn').addEventListener('click', function(){
    var typeSelect = document.getElementById('type-select');
    var colorSelect = document.getElementById('color-select');
    var type = typeSelect.value;
    var color = colorSelect.value;
    var colorLabel = color.charAt(0).toUpperCase() + color.slice(1);
    var typeLabel = type === 'custom' ? 'Custom' : DECKS[type].label;
    var name = colorLabel + ' ' + typeLabel;

    var rider;
    if(type === 'custom'){
      var raw = document.getElementById('custom-deck').value.trim();
      var exVal = parseInt(document.getElementById('custom-exhaustion').value.trim(), 10);
      var cards = raw.split(',').map(function(s){ return parseInt(s.trim(),10); }).filter(function(n){ return !isNaN(n); });
      if(cards.length === 0){
        alert('Enter at least one card value for the custom deck, e.g. 3,4,4,5,5,5');
        return;
      }
      if(isNaN(exVal)) exVal = cards[0];
      rider = makeRider(name, 'custom', cards, exVal, color);
      rider._customCards = cards.slice();
    } else {
      rider = makeRider(name, type, DECKS[type].cards, DECKS[type].exhaustion, color);
    }

    dealHand(rider);
    riders.push(rider);
    document.getElementById('custom-deck').value = '';
    document.getElementById('custom-exhaustion').value = '';
    render();
  });

  document.getElementById('reset-race-btn').addEventListener('click', resetRace);
  document.getElementById('clear-all-btn').addEventListener('click', function(){
    if(riders.length === 0) return;
    if(confirm('Remove all riders and start over?')) clearAll();
  });

  document.getElementById('riders-mount').addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var id = parseInt(btn.getAttribute('data-id'), 10);
    var rider = riders.find(function(r){ return r.id === id; });
    if(!rider) return;
    var action = btn.getAttribute('data-action');
    if(action === 'play'){
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      playCard(rider, idx);
    } else if(action === 'exhaust'){
      addExhaustion(rider);
    } else if(action === 'remove'){
      removeRider(id);
    } else if(action === 'reveal'){
      revealRider(id);
    } else if(action === 'next'){
      nextTurn(rider);
    } else if(action === 'undo'){
      undoPlay(rider);
    }
  });

  render();
})();
</script>
</body>
</html>
